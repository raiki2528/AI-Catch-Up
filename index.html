<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI Catch Up — LINE AI 情報交換コミュニティ メンバーディレクトリ" />
    <meta name="theme-color" content="#070b14" />
    <meta property="og:title" content="AI Catch Up | Members" />
    <meta property="og:description" content="AI Catch Up 参加者のプロフィール一覧" />
    <meta property="og:type" content="website" />
    <title>AI Catch Up | Members</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" type="module" defer></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="ambient__orb ambient__orb--1"></div>
      <div class="ambient__orb ambient__orb--2"></div>
      <div class="ambient__grid"></div>
    </div>

    <header class="header">
      <div class="container header__inner">
        <a class="brand" href="./index.html">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__text">
            <strong id="community-name">AI Catch Up</strong>
            <small id="community-tagline">LINE AI 情報交換コミュニティ</small>
          </span>
        </a>
        <div class="header__meta">
          <span class="pill pill--live">
            <span class="pill__dot"></span>
            <span id="member-count">— members</span>
          </span>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="hero container">
        <p class="eyebrow">Member Directory</p>
        <h1 class="hero__title">
          知の交差点、<br />
          <span class="gradient-text">AI Native</span> な仲間たち。
        </h1>
        <p class="hero__lead" id="community-description">
          AIの最新動向・実践知・つながりを共有する、クローズドなメンバー向けディレクトリです。
        </p>
      </section>

      <section class="members container" aria-labelledby="members-heading">
        <div class="members__head">
          <h2 id="members-heading" class="section-title">Participants</h2>
        </div>
        <div class="members__sections" id="members-sections"></div>
        <p class="empty-state" id="empty-state" hidden>該当するメンバーが見つかりませんでした。</p>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <p>Built for AI-native collaboration.</p>
        <p class="footer__mono">v0.1 · members.json で更新</p>
      </div>
    </footer>

    <template id="member-card-template">
      <article class="card">
        <div class="card__glow" aria-hidden="true"></div>
        <div class="card__top">
          <div class="avatar">
            <span class="avatar__initials"></span>
            <img class="avatar__img" alt="" width="64" height="64" loading="lazy" hidden />
          </div>
          <a class="card__linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn プロフィールを開く">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.062 2.062 0 012.063-2.063 2.062 2.062 0 012.064 2.063 2.062 2.062 0 01-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
              />
            </svg>
          </a>
        </div>
        <div class="card__body">
          <h3 class="card__name"></h3>
          <p class="card__title"></p>
          <p class="card__company"></p>
          <p class="card__note"></p>
          <ul class="card__tags"></ul>
        </div>
        <div class="card__footer">
          <span class="card__slug mono"></span>
        </div>
      </article>
    </template>
  </body>
</html>
